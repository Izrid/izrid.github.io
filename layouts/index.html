        {{ end }}

        {{ end }}

        cat: "open a post (cat <postdir>)",
        {{ end }}
        home: "clear screen and return to start",
        all: "show all details about me",
    };

    function progressBar(number) {
        var barLength = Math.round(number / 10);
        var barFilled = Array(barLength + 1).join("&#9611;");
        var barBlank= Array(11 - barLength).join("&#9617;");

        return barFilled + barBlank
    }

    // Calculate the tabbing to keep commands and descriptions aligned in the help message
    function padKey(key, length) {
        return key + ' '.repeat(length - key.length);
    }

    function commandsHelp() {
        let longestKeyLength = Math.max(...Object.keys(commands).map(key => key.length));

        let helpText = ""
        for (let key in commands) {
            if (commands.hasOwnProperty(key)) {
                helpText += ` ${padKey(key, longestKeyLength)}\t${commands[key]}\n`
            }
        }
        return helpText
    }

    var manual = '\n[[b;white;]usage:]\n' +

                 '\n[[b;white;]Available commands:]\n' +

        '[[b;grey;]Description:]\t{{ .description }}\n' +

    function social() {
        var hideName = false;
        let sMap = {
            {{ with .Site.Params.social.details }}
                {{ range. }}
                {{ .name }}: "{{ .url }}",
                {{ end }}
            {{ end }}
        };

        {{ if .Site.Params.social.settings.hideName }}
        hideName = true
        {{ end }}
        socialText = []
        for (let key in sMap) {
            if (sMap.hasOwnProperty(key)) {
                if (hideName) {
                    socialText.push(sMap[key]);
                } else {
                    let longestKeyLength = Math.max(...Object.keys(sMap).map(key => key.length));
                    socialText.push(`${padKey(key, longestKeyLength)}\t${sMap[key]}`)
                };
            }
        }

        return socialText
    };

    function lsCategories(term) {
        $.ajax({
            url: "posts/",
            type: 'GET',
            success: function(data) {
                term.echo(data, {raw: true});
            },
            error: function() {
                term.echo("Error: Could not load categories data");
            }
        });
    };

    function catPost(term, postdir) {
        var url = "/posts/" + postdir + "/";
        $.ajax({
            url: url,
            type: 'GET',
            success: function(data) {
                openModal('cat ' + postdir, data);
            },
            error: function() {
                term.echo("Error: Could not load post " + postdir);
            }
        });

    function catCollection(term, collection) {
        var key = collection.toLowerCase();
        if (!collections.hasOwnProperty(key)) {
            term.echo("Error: collection '" + collection + "' not found. Type 'ls' to see available collections.");
            return;
        }
        var postList = collections[key];

                html += "<strong>Tags:</strong> " + post.tags.join(" ") + "<br>";
            }
            html += "<br>" + post.title + "<br><br>";
        });
        term.echo(html, {raw: true});

            var segs = [], match, re = /(\s+|\S+)/g;
            while ((match = re.exec(line)) !== null) segs.push(match[0]);
            var nonSpace = segs.filter(function(s) { return /\S/.test(s); });
            var n = nonSpace.length, midIdx = Math.floor(n / 2), i = 0;
            return segs.map(function(s) {
                if (!/\S/.test(s)) return s;
                var color = (n < 4 || i === 0 || i === n - 1 || i === midIdx) ? 'yellow' : 'white';
                i++;
                return '<span style="color:' + color + '">' + s + '</span>';
            }).join('');
        });
        return '<div style="font-size:25%;line-height:1;font-family:inherit;white-space:pre;">' +
               lines.join('\n') +
               '</div>';

    function echoBanner(term) {
        var lines = `{{ .Site.Params.greetingbanner }}`.split('\n').filter(function(l) { return l.length > 0; });
        var numLines = lines.length;
        lines.forEach(function(line, i) {
            var delay = -(i / numLines * 8).toFixed(2);
            var escaped = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            term.echo('<span class="banner-line" style="animation-delay:' + delay + 's">' + escaped + '</span>', {raw: true});
        });
    }

    var _isMobile = ('ontouchstart' in window);

    var _browserName = (function() {
        var ua = navigator.userAgent;
        if (/Edg\//.test(ua)) return 'edge';
        if (/OPR\/|Opera/.test(ua)) return 'opera';
        if (/Firefox\//.test(ua)) return 'firefox';
        if (/Chrome\//.test(ua)) return 'chrome';
        if (/Safari\//.test(ua)) return 'safari';
        return 'terminal';
    })();

    var _currentBrowser = _browserName;
    var _cwd = null;

    var _promptPrefix = '{{ with .Site.Params.prompt }}{{ with .core }}[[;{{ .beforeColor | default "grey" }};]{{ .before }}][[;{{ .color | default "grey" }};]{{ .text }}';
    var _promptSuffix = '{{ .after }}]{{ end }}{{ with .separator }}[[;{{ .separatorColor | default "grey" }};]{{ .text }}]{{ end }}{{ with .path }}[[;{{ .beforeColor | default "grey" }};]{{ .before }}][[;{{ .color | default "grey" }};]{{ .text | default ":~$" }}][[;{{ .afterColor | default "grey" }};]{{ .after }}]{{ end }}{{ with .extra }}[[;{{ .color | default "grey" }};]{{ .text }}]{{ end }}{{ end }}';

    function buildPrompt(browser) {
        var pathSeg = '~' + (_cwd ? '/' + _cwd : '') + '$';
        return _promptPrefix + browser + _promptSuffix.replace(/~\$/, pathSeg);
    }

    function refreshPrompt() {
        if (typeof _term !== 'undefined' && _term) {
            _term.set_prompt(buildPrompt(_currentBrowser));
        }
    }

    var _FOLDER_ART =
        '   ______\n' +
        '  /      \\___\n' +
        ' |           |\n' +
        ' |           |\n' +
        ' |___________|';

    function _mpoCard(dataAttr, dataVal, label) {
        var safeAttr  = dataVal.replace(/"/g, '&quot;');
        var safeLabel = label.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<button class="mpo-folder" data-' + dataAttr + '="' + safeAttr + '">' +
               '<pre class="mpo-art">' + _FOLDER_ART + '</pre>' +
               '<span class="mpo-label">' + safeLabel + '</span>' +
               '</button>';
    }

    function mobilePosts(term) {
        var html = '<div class="mpo-grid">';
        Object.keys(collections).forEach(function(cat) {
            html += _mpoCard('cat', cat, cat);
        });
        html += '</div><div class="mpo-hint">Tap to view posts</div>';
        term.echo(html, {raw: true});
    }

    function mobileCatCollection(term, cat) {
        var key = cat.toLowerCase();
        if (!collections.hasOwnProperty(key)) {
            term.echo("Error: collection '" + cat + "' not found. Type 'ls' to see available collections.");
            return;
        }
        var html = '<div class="mpo-grid">';
        collections[key].forEach(function(post) {
            html += _mpoCard('filename', post.filename, post.title);
        });
        html += '</div><div class="mpo-hint">Tap to read</div>';
        term.echo(html, {raw: true});
    }

    var _term = $('body').terminal(function(command, term) {

        function echoArray(array) {
            for (i = 0; i < array.length; i += 1) {
                term.echo(array[i]);
            }
        }
        //Function used by StartX to draw the progressBar
        function progress(percent, width) {
            var size = Math.round(width*percent/100);
            var left = '', taken = '', i;
            for (i=size; i--;) {
                taken += '=';
            }
            if (taken.length > 0) {
                taken = taken.replace(/=$/, '>');
            }
            for (i=width-size; i--;) {
                left += ' ';
            }
            return '[' + taken + left + '] ' + percent + '%';
        }

        function loading () {
            var i = 0, size = 30;
            prompt = term.get_prompt();
            string = progress(0, size);
            term.set_prompt(progress);
            animation = true;
            (function loop() {
                string = progress(i++, size);
                term.set_prompt(string);
                if (i < 100) {
                    timer = setTimeout(loop, 10);
                } else {
                    term.echo(progress(i, size) + ' [[b;green;]OK]').set_prompt(prompt);
                    animation = false
                }
            })();
        }

        commands = command.split(/[ ]+/);

        switch(commands[0]) {
            case 'whoami':
                echoArray(whoami);
                break;
            {{ if .Site.Params.social }}
            case 'social':
                echoArray(social());
                break;
            {{ end }}
            {{ if .Site.Params.work }}
            case 'work':
                echoArray(work);
                break;
            {{ end }}
            {{ if .Site.Params.education }}
            case 'education':
                echoArray(education);
                break;
            {{ end }}
            {{ if .Site.Params.skills }}
            case 'skills':
                echoArray(skills);
                break;
            {{ end }}
            {{ if .Site.Params.softSkills }}
            case 'softskills':
                echoArray(softSkills);
                break;
            {{ end }}
            {{ if .Site.Params.languages }}
            case 'languages':
                echoArray(languages);
                break;
            {{ end }}
            {{ if .Site.Params.projects }}
            case 'projects':
                echoArray(projects);
                break;
            {{ end }}
            {{ if .Site.Params.publications }}
            case 'publications':
                echoArray(publications);
                break;
            {{ end }}
            case 'certifications':
                echoArray(certifications);
                break;
            case '{{ .Site.Params.misc.commandName | default "misc"}}':
                echoArray(misc);
                break;
            case 'man':
            case '?':
                term.echo(manual);
                break;
            case 'all':
                all.flat(1).forEach(function(item) {
                    if (item === source) {
                        term.echo(source, {raw: true});
                    } else {
                        term.echo(item);
                    }
                });
                break;
            {{ if .Site.Params.startxLocation }}
            case 'startx':
                term.echo("loading ...");
                loading();
                setTimeout(function(){window.location = "{{ .Site.Params.startxLocation }}"}, 2000);
                break;
            {{ end }}
            case ':(){:|:&};:':
                term.echo("nice try");
                break;
            case 'source':
                term.echo(source, {raw: true});
                break;
            case 'exit':
            {{ if .Site.Params.exitLocation }}
                term.echo("terminating ... ");
                loading();
                setTimeout(function(){window.location = '{{ .Site.Params.exitLocation }}'}, 2000);
                break;
            {{ else }}
                term.echo("Terminating session, thanks for visiting");
                loading();
                setTimeout(function() {
                  term.pause();
                  term.clear();
                  term.echo("{{ .Site.Params.exitMessage }}");
                }, 2000);
                break;
            {{ end }}
            {{ if .Site.Params.version }}
            case 'version':
                term.echo("{{ .Site.Params.version }}");
                break;
            {{ end }}
            {{ if .Site.Params.blog }}
            case 'cat':
                if (commands.length < 2) {
                    term.echo("Usage: cat <filename>");
                } else {
                    var postdir = commands[1];
                    catPost(term, postdir);
                }
                break;
            case 'ls':
                if (commands.length > 1) {
                    if (_isMobile) {
                        mobileCatCollection(term, commands[1]);
                    } else {
                        catCollection(term, commands[1]);
                    }
                } else if (_cwd) {
                    if (_isMobile) {
                        mobileCatCollection(term, _cwd);
                    } else {
                        catCollection(term, _cwd);
                    }
                } else if (_isMobile) {
                    mobilePosts(term);
                } else {
                    lsCategories(term);
                }
                break;
            case 'cd':
                var rawArg = commands[1] || '';
                var cdArg = rawArg.replace(/\/+$/, '');
                if (cdArg === '' || cdArg === '..' || cdArg === '~' || cdArg === '/') {
                    _cwd = null;
                    refreshPrompt();
                    break;
                }
                var cdKey = cdArg.toLowerCase();
                if (!collections.hasOwnProperty(cdKey)) {
                    term.echo("cd: no such category: " + rawArg);
                    break;
                }
                _cwd = cdKey;
                refreshPrompt();
                break;
            {{ end }}
            case 'home':
                _cwd = null;
                refreshPrompt();
                term.clear();
                {{ if .Site.Params.greetingbanner }}
                echoBanner(term);
                {{ end }}
                term.echo(`[[b;{{ .Site.Params.greetingColor | default "white" }};]{{ .Site.Params.greeting }}]`);
                break;
            case '':
                break;
            default:
                term.echo("\nunknown command: " + command + "\n" +
                          "please type 'man' or '?' for a list of available commands\n");
        }
    }, {

        {{ if .Site.Params.bootsequence }}
          greetings: false,
          onInit: function(term) {
          term.pause();
          term.typing('echo', 1, '{{ .Site.Params.bootsequence }}', function() {
            term.clear();
            {{ if .Site.Params.greetingbanner }}
              echoBanner(term);
              term.echo("[[b;{{ .Site.Params.greetingColor | default "white" }};]{{ .Site.Params.greeting }}]");
            {{ else }}
              term.echo("[[b;{{ .Site.Params.greetingColor | default "white" }};]{{ .Site.Params.greeting }}]");
            {{ end }}
          });
          term.resume();
          },
        {{ else }}
          greetings: false,
          onInit: function(term) {
            {{ if .Site.Params.greetingbanner }}
            echoBanner(term);
            {{ end }}
            term.echo(`[[b;{{ .Site.Params.greetingColor | default "white" }};]{{ .Site.Params.greeting }}]`);
          },
        {{ end }}

        prompt: buildPrompt(_browserName),

        keydown: function(e, term) {
            if (animation) {
                if (e.which == 68 && e.ctrlKey) { // CTRL+D
                    clearTimeout(timer);
                    animation = false;
                    term.echo(string + ' [[b;red;]FAIL]')
                    .set_prompt(prompt);
                }
                return false;
            }
        },
        autocompleteMenu: !('ontouchstart' in window),
        completion: Object.keys(commands)

    });

    _term.find('textarea').attr({
        autocorrect: 'off',
        autocapitalize: 'none',
        autocomplete: 'off',
        spellcheck: 'false'
    });

    var _modalFill = '-'.repeat(150);
    var _modalSide = '|<br>'.repeat(150);
    var $modal = $(
        '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
            '<div class="modal-window" tabindex="-1">' +
                '<div class="modal-side modal-side-left" aria-hidden="true">' + _modalSide + '</div>' +
                '<div class="modal-side modal-side-right" aria-hidden="true">' + _modalSide + '</div>' +
                '<div class="modal-titlebar">' +
                    '<span class="modal-deco">+--[ </span>' +
                    '<span class="modal-title"></span>' +
                    '<span class="modal-deco"> ]</span>' +
                    '<span class="modal-fill" aria-hidden="true">' + _modalFill + '</span>' +
                    '<span class="modal-deco">[ </span>' +
                    '<button class="modal-close" aria-label="Close">X</button>' +
                    '<span class="modal-deco"> ]--+</span>' +
                '</div>' +
                '<div class="modal-content"></div>' +
                '<div class="modal-footer">' +
                    '<span class="modal-deco">+--</span>' +
                    '<span class="modal-fill" aria-hidden="true">' + _modalFill + '</span>' +
                    '<span class="modal-deco">[ </span>' +
                    '<span class="modal-hint">W up   S down   ESC close</span>' +
                    '<span class="modal-deco"> ]</span>' +
                    '<span class="modal-fill" aria-hidden="true">' + _modalFill + '</span>' +
                    '<span class="modal-deco">--+</span>' +
                '</div>' +
            '</div>' +
        '</div>'
    ).appendTo('body');

    function openModal(title, contentHtml) {
        $modal.find('.modal-title').text(title);
        var $c = $modal.find('.modal-content').html(contentHtml);
        $c.find('a[href^="http"]').attr({target: '_blank', rel: 'noopener noreferrer'});
        $c.scrollTop(0);
        $modal.addClass('open');
        _term.pause();
        $modal.find('.modal-window').focus();
    }

    function closeModal() {
        if (!$modal.hasClass('open')) return;
        $modal.removeClass('open');
        _term.resume();
        _term.focus();
    }

    $modal.on('click', function(e) {
        if (e.target === this) closeModal();
    });
    $modal.find('.modal-close').on('click', closeModal);
    document.addEventListener('keydown', function(e) {
        if (!$modal.hasClass('open')) return;
        if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            closeModal();
            return;
        }
        var k = e.key.toLowerCase();
        if (k === 'w' || k === 's') {
            e.preventDefault();
            e.stopPropagation();
            var $c = $modal.find('.modal-content');
            var step = 80;
            $c.scrollTop($c.scrollTop() + (k === 'w' ? -step : step));
        }
    }, true);

    $(document).on('click', '.mpo-folder', function() {
        var cat      = $(this).data('cat');
        var filename = $(this).data('filename');
        if (cat !== undefined) {
            mobileCatCollection(_term, cat);
        } else if (filename !== undefined) {
            _term.exec('cat ' + filename);
        }
    });

    if (navigator.brave) {
        navigator.brave.isBrave().then(function(isBrave) {
            if (isBrave) {
                _currentBrowser = 'brave';
                refreshPrompt();
            }
        }).catch(function(){});
    }
});
